name: Build Caddy with Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Monthly, for fixes in the Caddy base image and the Cloudflare plugin
  # (xcaddy builds the plugin's latest release).
  schedule:
    - cron: '0 6 1 * *'

jobs:
  build:
    # Native arm64, so nothing is emulated.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Read the Caddy version
        id: caddy
        run: echo "version=$(sed -n 's/^ARG CADDY_VERSION=//p' Dockerfile)" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          platforms: linux/arm64
          push: true
          # A fresh base image and plugin every time, not cached layers.
          pull: true
          no-cache: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/caddy-cloudflare:latest
            ghcr.io/${{ github.repository_owner }}/caddy-cloudflare:v${{ steps.caddy.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.caddy.outputs.version }}
